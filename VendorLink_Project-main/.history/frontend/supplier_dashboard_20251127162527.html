<!DOCTYPE html>
<html lang="en" class="bg-gray-100 dark:bg-gray-900">
<head>
  <meta charset="UTF-8">
  <title>VendorLink • Supplier Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="min-h-screen">

<nav class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md shadow-sm border-b border-gray-200 dark:border-gray-700">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 onclick="window.location.href='index.html'" 
        class="text-2xl font-extrabold text-amber-600 cursor-pointer tracking-tight">
      VendorLink
    </h1>

    <div class="flex gap-4 items-center">
      <button id="themeToggle" class="w-10 h-10 rounded-full flex items-center justify-center bg-gray-200 dark:bg-gray-700">
        🌓
      </button>

      <button onclick="logout()"
              class="px-4 py-2 text-sm font-semibold text-red-600 dark:text-red-400 hover:underline">
        Logout
      </button>
    </div>
  </div>
</nav>


<main class="p-6 space-y-8">

  <section>
    <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-100 mb-3">Quick Analytics</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-4">
        <p class="text-gray-500 dark:text-gray-400 text-sm">Total Orders</p>
        <p id="totalOrders" class="text-2xl font-bold text-amber-600">0</p>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow p-4">
        <p class="text-gray-500 dark:text-gray-400 text-sm">Total Revenue</p>
        <p id="revenue" class="text-2xl font-bold text-green-600">₹0</p>
      </div>
    </div>
  </section>

  <section class="bg-white dark:bg-gray-800 rounded-xl shadow p-4">
    <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-3">Add Product</h2>
    <form id="addProductForm" class="grid gap-3 md:grid-cols-4">
      <input id="pName" type="text" placeholder="Name" class="p-2 rounded border dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100" required>
      <input id="pPrice" type="number" placeholder="Price" class="p-2 rounded border dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100" required>
      <input id="pImage" type="text" placeholder="Image URL" class="p-2 rounded border dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100">
      <input id="pCategory" type="text" placeholder="Category" class="p-2 rounded border dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100">
      <button class="md:col-span-4 bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-lg mt-2">
        Add Product
      </button>
    </form>
  </section>

  <section class="bg-white dark:bg-gray-800 rounded-xl shadow p-4">
    <h2 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-3">My Products</h2>
    <table class="w-full text-sm text-left">
      <thead class="border-b border-gray-200 dark:border-gray-700">
        <tr class="text-gray-500 dark:text-gray-400">
          <th class="py-2">Name</th>
          <th class="py-2">Price</th>
          <th class="py-2">Category</th>
          <th class="py-2">Actions</th>
        </tr>
      </thead>
      <tbody id="productTable" class="divide-y divide-gray-100 dark:divide-gray-700"></tbody>
    </table>
  </section>

</main>

<script type="module" src="assets/js/supplier.js"></script>
</body>
</html>
