<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VendorLink • Smart Sourcing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

<!-- NAV -->
<nav class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md shadow-sm border-b border-gray-200 dark:border-gray-700">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 onclick="window.location.href='index.html'" 
        class="text-2xl font-extrabold text-amber-600 cursor-pointer tracking-tight">
      VendorLink

    <div class="flex gap-4 items-center">
      <button id="themeToggle" class="w-10 h-10 rounded-full flex items-center justify-center bg-gray-200 dark:bg-gray-700">

      </button>

      <button onclick="logout()"
              class="px-4 py-2 text-sm font-semibold text-red-600 dark:text-red-400 hover:underline">
        Logout
      </button>
    </div>
  </div>
</nav>


<!-- HERO -->
<section class="p-10 text-center">
    <h2 class="text-4xl font-bold text-gray-800">Smart Sourcing for Street Food Vendors</h2>
    <p class="text-gray-500 mt-3 max-w-2xl mx-auto">
        Discover reliable suppliers, compare prices, and enhance your business efficiency.
    </p>

    <button onclick="window.location.href='marketplace.html'"
            class="bg-amber-600 text-white px-6 py-3 mt-6 rounded-lg shadow hover:bg-amber-700">
        Explore Marketplace
    </button>

</html>
