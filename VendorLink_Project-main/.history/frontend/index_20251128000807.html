<!DOCTYPE html>
<html lang="en" class="bg-gray-50 dark:bg-gray-900">
<head>
  <meta charset="UTF-8">
  <title>VendorLink • Smart Sourcing for Street Food Vendors</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" }
  </script>

  <style>
    /* reused styles from your original file */
    .nav-link { color:#444; text-decoration:none; }
    .nav-link:hover { color:#d97706; }
    .dark .nav-link { color:#ddd; }

    .btn-outline {
      padding:6px 14px; border:1px solid #d97706; color:#d97706; border-radius:8px;
    }
    .btn-outline:hover { background:#fff7e6; }

    .btn-filled {
      background:#d97706; color:white; padding:6px 14px; border-radius:8px;
    }
    .btn-filled:hover { background:#b45309; }

    .profile-btn { padding:6px 14px; background:#f3f4f6; border-radius:8px; }
    .dark .profile-btn { background:#374151; }

    .dropdown-item {
      padding:10px 15px; display:block; font-size:0.9rem;
      color:#4b5563; text-align:left;
    }
    .dropdown-item:hover { background:#f5f5f5; }
    .dark .dropdown-item { color:#e5e7eb; }

    .toggle-checkbox { width:40px; height:20px; accent-color:#d97706; }
    .theme-btn { padding:6px; background:#e5e7eb; border-radius:6px; }
    .dark .theme-btn { background:#4b5563; }
  </style>
</head>

<body class="text-gray-900 dark:text-gray-100">

<!-- ⭐ Navbar will be injected by navbar.js -->
<script type="module" src="assets/js/navbar.js"></script>

<!-- MAIN CONTENT -->
<main class="max-w-7xl mx-auto px-4 py-10">
  <section class="grid md:grid-cols-2 gap-12 items-center">

    <!-- LEFT SECTION -->
    <div>
      <h1 class="text-5xl font-extrabold leading-tight">
        Smart sourcing for <span class="text-amber-600">street food vendors</span>.
      </h1>

      <p class="mt-4 text-gray-600 dark:text-gray-300 text-lg">
        Discover trusted suppliers, optimize costs, and grow your business with smart analytics.
      </p>

      <div class="mt-6 flex gap-4">
        <a href="marketplace.html"
           class="px-6 py-3 rounded-lg bg-amber-600 text-white font-semibold hover:bg-amber-700">
          Explore Marketplace
        </a>

        <a href="signup.html"
           class="px-6 py-3 rounded-lg border border-gray-300 dark:border-gray-700
                  text-gray-700 dark:text-gray-200 font-semibold hover:border-amber-600">
          Join VendorLink
        </a>
      </div>

      <!-- ⭐ AI Price Button -->
      <a href="ai_predict.html">
        <button class="mt-5 px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg shadow">
          🔮 AI Price Prediction
        </button>
      </a>
    </div>

    <!-- RIGHT LIVE SNAPSHOT CARD -->
    <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-xl p-6 space-y-4">
      <h2 class="text-lg font-semibold mb-4">Live Snapshot</h2>

      <div class="grid grid-cols-3 gap-4 text-center">

        <div class="bg-amber-50 dark:bg-gray-900 rounded-xl p-3">
          <p class="text-xs text-gray-500 dark:text-gray-400">Active Vendors</p>
          <p class="text-2xl font-bold text-amber-600">120+</p>
        </div>

        <div class="bg-emerald-50 dark:bg-gray-900 rounded-xl p-3">
          <p class="text-xs text-gray-500 dark:text-gray-400">Suppliers</p>
          <p class="text-2xl font-bold text-emerald-600">45+</p>
        </div>

        <div class="bg-indigo-50 dark:bg-gray-900 rounded-xl p-3">
          <p class="text-xs text-gray-500 dark:text-gray-400">Orders Per Day</p>
          <p class="text-2xl font-bold text-indigo-600">300+</p>
        </div>

      </div>
    </div>

  </section>
</main>

</body>
</html>
