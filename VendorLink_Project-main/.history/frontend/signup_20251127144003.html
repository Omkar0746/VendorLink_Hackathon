<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - VendorLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-[#FDFBF6] flex items-center justify-center min-h-screen py-12">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#4A4A4A]">Create Your Account</h1>
            <p class="text-gray-500 mt-2">Join the VendorLink community.</p>
        </div>

        <form id="signupForm" class="space-y-4">

            <div>
                <label class="block text-sm font-medium text-gray-700">Your Name</label>
                <input type="text" id="name" placeholder="Enter your full name"
                       class="mt-1 w-full p-3 border border-gray-300 rounded-lg" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" placeholder="Enter your email"
                       class="mt-1 w-full p-3 border border-gray-300 rounded-lg" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" placeholder="Choose a secure password"
                       class="mt-1 w-full p-3 border border-gray-300 rounded-lg" required>
            </div>

            <button type="submit"
                    class="w-full bg-amber-600 text-white py-3 rounded-lg hover:bg-amber-700 mt-4">
                Create Account
            </button>

        </form>

        <p class="text-sm text-center text-gray-500 mt-6">
            Already have an account? <a href="login.html" class="text-amber-600 hover:underline">Login</a>
        </p>
    </div>

    <!-- Only one correct script -->
    <script src="js/signup.js"></script>

</body>
</html>
