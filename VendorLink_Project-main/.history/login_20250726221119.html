<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VendorLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#FDFBF6] flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-sm w-full">
        <div class="text-center mb-8">
            <a href="index.html" class="text-3xl font-bold text-[#4A4A4A]">Vendor<span class="text-[#D97706]">Link</span></a>
            <p class="text-gray-500 mt-2">Welcome back! Please login to your account.</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500" required>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500" required>
            </div>

            <div>
                <button type="submit" class="w-full bg-amber-600 text-white py-3 px-4 rounded-lg hover:bg-amber-700 transition-colors font-semibold shadow-md">Login</button>
            </div>
        </form>

        <p class="text-sm text-center text-gray-500 mt-6">
            Don't have an account? <a href="signup.html" class="font-medium text-amber-600 hover:underline">Sign Up</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Get the list of registered users from localStorage
            const users = JSON.parse(localStorage.getItem('vendorLinkUsers')) || [];

            // Find a user that matches the entered username and password
            const foundUser = users.find(user => user.username === username && user.password === password);

            if (foundUser) {
                // If user is found, save them as the 'currentUser' in localStorage
                // This is the crucial step
                localStorage.setItem('currentUser', JSON.stringify(foundUser));
                
                alert('Login successful!');
                // Redirect to the main index page, which will handle routing
                window.location.href = 'index.html';
            } else {
                // If no user is found, show an error message
                alert('Invalid username or password. Please try again.');
            }
        });
    </script>
</body>
</html>
