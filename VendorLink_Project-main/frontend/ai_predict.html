<!DOCTYPE html>
<html lang="en" class="bg-gray-100 dark:bg-gray-900">
<head>
  <meta charset="UTF-8">
  <title>AI Price Prediction • VendorLink</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
</head>

<body class="text-gray-900 dark:text-gray-100">

<!-- Navbar -->
<script type="module" src="assets/js/navbar.js"></script>

<section class="max-w-3xl mx-auto px-4 py-10">

  <h1 class="text-3xl md:text-4xl font-bold text-amber-600 mb-4">
    AI Price Prediction
  </h1>
  <p class="text-gray-500 dark:text-gray-400 mb-8">
    Predict future prices of raw materials based on product, season and location.
  </p>

  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-6 space-y-4">

    <div>
      <label class="block text-sm font-medium mb-1">Product</label>
      <select id="product" class="w-full px-3 py-2 rounded-xl border dark:bg-gray-900">
        <option value="">Select product</option>
        <option>Tomato</option>
        <option>Onion</option>
        <option>Potato</option>
        <option>Rice</option>
        <option>Wheat</option>
        <!-- you can adjust based on dataset -->
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Season</label>
      <select id="season" class="w-full px-3 py-2 rounded-xl border dark:bg-gray-900">
        <option value="">Select season</option>
        <option>Summer</option>
        <option>Winter</option>
        <option>Monsoon</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Location</label>
      <select id="location" class="w-full px-3 py-2 rounded-xl border dark:bg-gray-900">
        <option value="">Select location</option>
        <option>Mumbai</option>
        <option>Pune</option>
        <option>Delhi</option>
        <option>Bangalore</option>
        <!-- again, adjust based on dataset values -->
      </select>
    </div>

    <button id="predictBtn"
            class="w-full mt-2 bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-xl font-semibold">
      Predict Price
    </button>

  </div>

  <div id="resultBox" class="mt-6 hidden bg-white dark:bg-gray-800 rounded-2xl shadow p-6">
    <h2 class="text-xl font-bold mb-2">Prediction Result</h2>
    <p id="predictionText" class="text-gray-700 dark:text-gray-200"></p>
  </div>

</section>

<script type="module">
  const btn = document.getElementById("predictBtn");
  const resultBox = document.getElementById("resultBox");
  const predictionText = document.getElementById("predictionText");

  btn.addEventListener("click", async () => {
    const product = document.getElementById("product").value;
    const season = document.getElementById("season").value;
    const location = document.getElementById("location").value;

    if (!product || !season || !location) {
      alert("Please select product, season and location.");
      return;
    }

    try {
      const res = await fetch("http://127.0.0.1:5001/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ product, season, location }),
      });

      const data = await res.json();

      if (data.error) {
        predictionText.textContent = "Error: " + data.error;
      } else {
        predictionText.innerHTML = `
          <b>${data.product}</b> in <b>${data.location}</b> during <b>${data.season}</b><br/>
          Predicted price: <b>₹${data.predicted_price}</b><br/>
          ${
            data.actual_average
              ? `Historical average price: ₹${data.actual_average}`
              : ""
          }
        `;
      }

      resultBox.classList.remove("hidden");
    } catch (err) {
      predictionText.textContent = "Failed to connect to AI service.";
      resultBox.classList.remove("hidden");
    }
  });
</script>

</body>
</html>
