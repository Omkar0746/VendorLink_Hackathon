<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorLink - Supplier Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .nav-link.active {
            background-color: #FEEBC9; /* A light amber color */
            color: #D97706; /* Dark amber color */
        }
        /* Modal styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background-color: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>
<body class="bg-[#FDFBF6] min-h-screen flex flex-col">
    <header class="bg-white shadow-md sticky top-0 z-20">
        <nav class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <span class="text-2xl font-bold text-[#4A4A4A]">Vendor<span class="text-[#D97706]">Link</span></span>
                    <span id="supplierNameDisplay" class="ml-4 text-lg text-gray-600">(Supplier Dashboard)</span>
                </div>
                
                <div class="flex space-x-4">
                    <a href="#" data-page="products" class="nav-link active px-3 py-2 rounded-md text-sm font-medium transition-colors">Products</a>
                    <a href="#" data-page="profile" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors">Profile</a>
                    <a href="#" data-page="orders" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors">Orders</a>
                </div>

                <div>
                    <a href="index.html" id="logoutBtn" class="text-red-700 hover:bg-red-100 px-3 py-2 rounded-md text-sm font-medium transition-colors">Logout</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="content-area">
            </div>
    </main>
    
    <div id="editProductModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 class="text-xl font-semibold text-gray-700 mb-4">✏️ Edit Product</h3>
            <form id="editProductForm" class="space-y-4">
                <input type="hidden" id="editProductId">
                <div>
                    <label for="editProductName" class="block text-sm font-medium text-gray-700">Product Name</label>
                    <input type="text" id="editProductName" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-amber-500 focus:border-amber-500">
                </div>
                <div>
                    <label for="editProductCategory" class="block text-sm font-medium text-gray-700">Category</label>
                    <input type="text" id="editProductCategory" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-amber-500 focus:border-amber-500">
                </div>
                <div>
                    <label for="editProductPrice" class="block text-sm font-medium text-gray-700">Price (per unit)</label>
                    <input type="number" id="editProductPrice" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-amber-500 focus:border-amber-500">
                </div>
                <div>
                    <label for="editProductUnit" class="block text-sm font-medium text-gray-700">Unit (e.g., kg, litre)</label>
                    <input type="text" id="editProductUnit" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-amber-500 focus:border-amber-500">
                </div>
                <div class="flex justify-end space-x-2 mt-4">
                    <button type="button" id="closeModalBtn" class="py-2 px-4 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors font-medium">Cancel</button>
                    <button type="submit" class="bg-amber-600 text-white py-2 px-4 rounded-lg hover:bg-amber-700 transition-colors font-semibold">Save Changes</button>
                </div>
            </form>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- 1. GET CURRENT USER & AUTHENTICATION ---
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));

            if (!currentUser || currentUser.category !== 'supplier') {
                alert('Access denied. Please log in as a supplier.');
                window.location.href = 'login.html';
                return;
            }

            // --- SIMULATED DATA (Orders and Products can still be simulated for now) ---
            let supplierProducts = [
                { id: 'p1', name: 'Tomatoes', category: 'Vegetables', price: 28, unit: 'kg' },
                { id: 'p2', name: 'Onions', category: 'Vegetables', price: 30, unit: 'kg' },
                { id: 'p3', name: 'Turmeric Powder', category: 'Spices', price: 180, unit: 'kg' },
                { id: 'p4', name: 'Basmati Rice', category: 'Grains', price: 90, unit: 'kg' },
            ];

            const supplierOrders = [
                { id: 'o1', customer: 'Vendor A', product: 'Tomatoes', quantity: '5kg', price: '₹140', status: 'New', date: '2025-07-25' },
                { id: 'o2', customer: 'Vendor B', product: 'Chilli Powder', quantity: '1kg', price: '₹220', status: 'Completed', date: '2025-07-24' },
                { id: 'o3', customer: 'Vendor C', product: 'Onions', quantity: '10kg', price: '₹300', status: 'New', date: '2025-07-25' },
                { id: 'o4', customer: 'Vendor D', product: 'Milk', quantity: '20litres', price: '₹1100', status: 'Completed', date: '2025-07-23' },
            ];

            // --- DOM ELEMENTS ---
            const navLinks = document.querySelectorAll('.nav-link');
            const contentArea = document.getElementById('content-area');
            const supplierNameDisplay = document.getElementById('supplierNameDisplay');
            const editProductModal = document.getElementById('editProductModal');
            const editProductForm = document.getElementById('editProductForm');

            // --- RENDER FUNCTIONS ---
            const renderProfilePage = () => {
                contentArea.innerHTML = `
                    <div class="bg-white p-6 rounded-lg shadow-sm">
                        <h2 class="text-xl font-semibold text-gray-700 mb-4">👤 Your Profile</h2>
                        <p class="text-sm text-gray-500 mb-4">This information is visible to vendors. Keep it up-to-date to build trust.</p>
                        <form id="supplierProfileForm" class="space-y-4">
                            <div>
                                <label for="shopName" class="block text-sm font-medium text-gray-700">Shop Name</label>
                                <input type="text" id="shopName" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-amber-500 focus:border-amber-500" value="${currentUser.shopName || ''}">
                            </div>
                            <div>
                                <label for="supplierName" class="block text-sm font-medium text-gray-700">Your Name (Contact Person)</label>
                                <input type="text" id="supplierName" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-amber-500 focus:border-amber-500" value="${currentUser.name || ''}">
                            </div>
                            <div>
                                <label for="contactNumber" class="block text-sm font-medium text-gray-700">Contact Number</label>
                                <input type="text" id="contactNumber" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-amber-500 focus:border-amber-500" value="${currentUser.contactNumber || ''}">
                            </div>
                            <div>
                                <label for="location" class="block text-sm font-medium text-gray-700">Location</label>
                                <input type="text" id="location" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-amber-500 focus:border-amber-500" value="${currentUser.location || ''}">
                            </div>
                            <div>
                                <label for="description" class="block text-sm font-medium text-gray-700">Description / Specialization</label>
                                <textarea id="description" rows="3" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-amber-500 focus:border-amber-500">${currentUser.description || ''}</textarea>
                            </div>
                             <div class="flex items-center">
                                <span class="text-amber-500 font-bold text-lg mr-2">Current Rating: ${currentUser.rating || 'N/A'} ★</span>
                                <p class="text-sm text-gray-500">(Ratings are based on vendor feedback)</p>
                            </div>
                            <button type="submit" class="w-full bg-amber-600 text-white py-2 px-4 rounded-lg hover:bg-amber-700 transition-colors font-semibold">Save Profile</button>
                        </form>
                    </div>
                `;

                document.getElementById('supplierProfileForm').addEventListener('submit', (e) => {
                    e.preventDefault();

                    // --- 5. UPDATE & PERSIST PROFILE CHANGES ---
                    // a. Update the currentUser object in memory
                    currentUser.name = document.getElementById('supplierName').value;
                    currentUser.shopName = document.getElementById('shopName').value;
                    currentUser.contactNumber = document.getElementById('contactNumber').value;
                    currentUser.location = document.getElementById('location').value;
                    currentUser.description = document.getElementById('description').value;

                    // b. Update the 'currentUser' in localStorage
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));

                    // c. Update the master user list for full persistence
                    const allUsers = JSON.parse(localStorage.getItem('vendorLinkUsers')) || [];
                    const userIndex = allUsers.findIndex(user => user.username === currentUser.username);
                    if (userIndex !== -1) {
                        allUsers[userIndex] = currentUser;
                        localStorage.setItem('vendorLinkUsers', JSON.stringify(allUsers));
                    }
                    
                    updateSupplierNameDisplay();
                    showMessageBox('Profile updated successfully!', 'success');
                });
            };

            const renderProductsPage = () => {
                contentArea.innerHTML = `
                    <div class="grid grid-cols-1 gap-6">
                        <div class="bg-white p-6 rounded-lg shadow-sm">
                            <h2 class="text-xl font-semibold text-gray-700 mb-4">📦 Add New Product</h2>
                            <form id="addProductForm" class="space-y-4">
                                <div>
                                    <label for="newProductName" class="block text-sm font-medium text-gray-700">Product Name</label>
                                    <input type="text" id="newProductName" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-amber-500 focus:border-amber-500" required>
                                </div>
                                <div>
                                    <label for="newProductCategory" class="block text-sm font-medium text-gray-700">Category</label>
                                    <input type="text" id="newProductCategory" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-amber-500 focus:border-amber-500" required>
                                </div>
                                <div>
                                    <label for="newProductPrice" class="block text-sm font-medium text-gray-700">Price (per unit)</label>
                                    <input type="number" id="newProductPrice" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-amber-500 focus:border-amber-500" required>
                                </div>
                                <div>
                                    <label for="newProductUnit" class="block text-sm font-medium text-gray-700">Unit (e.g., kg, litre)</label>
                                    <input type="text" id="newProductUnit" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-amber-500 focus:border-amber-500" required>
                                </div>
                                <button type="submit" class="w-full bg-amber-600 text-white py-2 px-4 rounded-lg hover:bg-amber-700 transition-colors font-semibold">Add Product</button>
                            </form>
                        </div>

                        <div class="bg-white p-6 rounded-lg shadow-sm">
                            <h2 class="text-xl font-semibold text-gray-700 mb-4">📋 Your Current Products</h2>
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-gray-200">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Product</th>
                                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price/Unit</th>
                                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="currentProductsTableBody" class="bg-white divide-y divide-gray-200">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
                renderSupplierProducts();
                setupProductEventListeners();
            };

            const renderOrdersPage = () => {
                contentArea.innerHTML = `
                    <div class="bg-white p-6 rounded-lg shadow-sm">
                        <h2 class="text-xl font-semibold text-gray-700 mb-4">🛒 Your Orders Overview</h2>
                        <p class="text-sm text-gray-500 mb-4">Here's a simple overview of your recent orders. You can see new orders that need action and a summary of past completed orders.</p>

                        <h3 class="text-lg font-semibold text-amber-700 mb-3">New Orders (Pending Action)</h3>
                        <div id="newOrdersList" class="space-y-3 mb-6"></div>

                        <h3 class="text-lg font-semibold text-gray-700 mb-3">Completed Orders (History)</h3>
                        <div id="completedOrdersList" class="space-y-3"></div>
                    </div>
                `;
                renderSupplierOrders();
                setupOrderEventListeners();
            };
            
            const showMessageBox = (message, type = 'success') => {
                let messageBox = document.getElementById('messageBox');
                if (!messageBox) {
                    messageBox = document.createElement('div');
                    messageBox.id = 'messageBox';
                    messageBox.className = 'fixed bottom-4 right-4 p-4 rounded-lg shadow-lg text-white transition-opacity duration-300 opacity-0 z-50';
                    document.body.appendChild(messageBox);
                }
                messageBox.textContent = message;
                messageBox.style.backgroundColor = type === 'success' ? '#4CAF50' : '#F44336';
                messageBox.classList.add('opacity-100');
                setTimeout(() => {
                    messageBox.classList.remove('opacity-100');
                }, 3000);
            };
            
            // --- 3. UPDATE NAVBAR DISPLAY ---
            const updateSupplierNameDisplay = () => {
                supplierNameDisplay.textContent = `(${currentUser.name || 'Supplier'} Dashboard)`;
            };
            
            const showEditProductModal = (product) => {
                document.getElementById('editProductId').value = product.id;
                document.getElementById('editProductName').value = product.name;
                document.getElementById('editProductCategory').value = product.category;
                document.getElementById('editProductPrice').value = product.price;
                document.getElementById('editProductUnit').value = product.unit;
                editProductModal.classList.remove('hidden');
            };

            const hideEditProductModal = () => {
                editProductModal.classList.add('hidden');
            };
            
            const renderSupplierProducts = () => {
                const currentProductsTableBody = document.getElementById('currentProductsTableBody');
                if (currentProductsTableBody) {
                    currentProductsTableBody.innerHTML = supplierProducts.map(product => `
                        <tr id="product-${product.id}">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${product.name}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${product.category}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">₹${product.price}/${product.unit}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                <button type="button" data-product-id="${product.id}" class="edit-product text-indigo-600 hover:text-indigo-900 mr-2">Edit</button>
                                <button type="button" data-product-id="${product.id}" class="delete-product text-red-600 hover:text-red-900">Delete</button>
                            </td>
                        </tr>
                    `).join('');
                }
            };
            
            const setupProductEventListeners = () => {
                const addProductForm = document.getElementById('addProductForm');
                const currentProductsTableBody = document.getElementById('currentProductsTableBody');

                if (addProductForm) {
                    addProductForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const newProduct = {
                            id: `p${Date.now()}`,
                            name: document.getElementById('newProductName').value.trim(),
                            category: document.getElementById('newProductCategory').value.trim(),
                            price: parseFloat(document.getElementById('newProductPrice').value),
                            unit: document.getElementById('newProductUnit').value.trim()
                        };
                        supplierProducts.push(newProduct);
                        renderSupplierProducts();
                        addProductForm.reset();
                        showMessageBox('Product added successfully!', 'success');
                    });
                }
                
                if (currentProductsTableBody) {
                    currentProductsTableBody.addEventListener('click', (e) => {
                        const target = e.target;
                        if (target.classList.contains('delete-product')) {
                            const productId = target.dataset.productId;
                            if (confirm('Are you sure you want to delete this product?')) {
                                supplierProducts = supplierProducts.filter(p => p.id !== productId);
                                renderSupplierProducts();
                                showMessageBox('Product deleted successfully!', 'success');
                            }
                        } else if (target.classList.contains('edit-product')) {
                            const productId = target.dataset.productId;
                            const productToEdit = supplierProducts.find(p => p.id === productId);
                            if (productToEdit) showEditProductModal(productToEdit);
                        }
                    });
                }
            };
            
            editProductForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const productId = document.getElementById('editProductId').value;
                const productIndex = supplierProducts.findIndex(p => p.id === productId);
                
                if (productIndex !== -1) {
                    supplierProducts[productIndex].name = document.getElementById('editProductName').value.trim();
                    supplierProducts[productIndex].category = document.getElementById('editProductCategory').value.trim();
                    supplierProducts[productIndex].price = parseFloat(document.getElementById('editProductPrice').value);
                    supplierProducts[productIndex].unit = document.getElementById('editProductUnit').value.trim();
                    
                    renderSupplierProducts();
                    hideEditProductModal();
                    showMessageBox('Product updated successfully!', 'success');
                }
            });

            document.getElementById('closeModalBtn').addEventListener('click', hideEditProductModal);

            const renderSupplierOrders = () => {
                const newOrdersList = document.getElementById('newOrdersList');
                const completedOrdersList = document.getElementById('completedOrdersList');
                if (newOrdersList) {
                    newOrdersList.innerHTML = supplierOrders.filter(o => o.status === 'New').map(order => `
                        <div class="bg-amber-50 p-3 rounded-lg border border-amber-100 flex justify-between items-center">
                            <div>
                                <p class="font-semibold text-gray-800">Order #${order.id} - ${order.product} (${order.quantity})</p>
                                <p class="text-sm text-gray-600">From: ${order.customer} | Price: ${order.price} | Date: ${order.date}</p>
                            </div>
                            <button type="button" data-order-id="${order.id}" class="mark-completed-btn bg-green-600 text-white py-1 px-3 rounded-md text-sm hover:bg-green-700 transition-colors">Mark Completed</button>
                        </div>
                    `).join('') || '<p class="text-gray-500">No new orders.</p>';
                    
                    completedOrdersList.innerHTML = supplierOrders.filter(o => o.status === 'Completed').map(order => `
                        <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
                            <p class="font-semibold text-gray-800">Order #${order.id} - ${order.product} (${order.quantity})</p>
                            <p class="text-sm text-gray-600">From: ${order.customer} | Price: ${order.price} | Date: ${order.date}</p>
                        </div>
                    `).join('') || '<p class="text-gray-500">No completed orders yet.</p>';
                }
            };
            
            const setupOrderEventListeners = () => {
                const newOrdersList = document.getElementById('newOrdersList');
                if (newOrdersList) {
                    newOrdersList.addEventListener('click', (e) => {
                        const target = e.target;
                        if (target.classList.contains('mark-completed-btn')) {
                            const orderId = target.dataset.orderId;
                            const order = supplierOrders.find(o => o.id === orderId);
                            if (order) {
                                order.status = 'Completed';
                                renderSupplierOrders();
                                showMessageBox(`Order #${orderId} marked as completed!`, 'success');
                            }
                        }
                    });
                }
            };

            const navigateTo = (page) => {
                navLinks.forEach(link => link.classList.remove('active'));
                const activeLink = document.querySelector(`.nav-link[data-page="${page}"]`);
                if (activeLink) activeLink.classList.add('active');
                
                switch(page) {
                    case 'products': renderProductsPage(); break;
                    case 'profile': renderProfilePage(); break;
                    case 'orders': renderOrdersPage(); break;
                    default: renderProductsPage();
                }
            };

            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    navigateTo(e.target.dataset.page);
                });
            });

            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            });

            // --- INITIALIZATION ---
            updateSupplierNameDisplay();
            navigateTo('products'); // Start on the products page by default
        });
    </script>
</body>
</html>
