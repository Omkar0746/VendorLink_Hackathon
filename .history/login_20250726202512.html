<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VendorLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#FDFBF6] flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-sm w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#4A4A4A]">Welcome Back!</h1>
            <p class="text-gray-500 mt-2">Login to your VendorLink account.</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
                <select id="category" name="category" class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500" required>
                    <option value="vendor">Vendor</option>
                    <option value="supplier">Supplier</option>
                </select>
            </div>

            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500" required>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500" required>
            </div>

            <p id="errorMessage" class="text-red-500 text-sm text-center hidden"></p>

            <div>
                <button type="submit" class="w-full bg-amber-600 text-white py-3 px-4 rounded-lg hover:bg-amber-700 transition-colors font-semibold shadow-md">Login</button>
            </div>
        </form>

        <p class="text-sm text-center text-gray-500 mt-6">
            Don't have an account? <a href="signup.html" class="font-medium text-amber-600 hover:underline">Sign Up</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const category = document.getElementById('category').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            const users = JSON.parse(localStorage.getItem('vendorLinkUsers')) || [];
            
            const foundUser = users.find(user => user.username === username && user.password === password && user.category === category);

            if (foundUser) {
                localStorage.setItem('currentUser', JSON.stringify(foundUser));
                
                if (category === 'vendor') {
                    window.location.href = 'index.html';
                } else if (category === 'supplier') {
                    window.location.href = 'supplier_dashboard.html';
                }
            } else {
                errorMessage.textContent = 'Invalid credentials or category. Please try again.';
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
