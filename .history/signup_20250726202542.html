<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - VendorLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#FDFBF6] flex items-center justify-center min-h-screen py-12">
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-sm w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#4A4A4A]">Create Your Account</h1>
            <p class="text-gray-500 mt-2">Join the VendorLink community.</p>
        </div>

        <form id="signupForm" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500" required>
            </div>

            <div>
                <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
                <select id="category" name="category" class="mt-1 block w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500" required>
                    <option value="vendor">Vendor</option>
                    <option value="supplier">Supplier</option>
                </select>
            </div>

            <div id="shopNameContainer" class="hidden">
                <label for="shopName" class="block text-sm font-medium text-gray-700">Shop Name</label>
                <input type="text" id="shopName" name="shopName" placeholder="Enter your shop name" class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
            </div>

            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Create Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500" required>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Create Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a secure password" class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500" required>
            </div>

            <div>
                <button type="submit" class="w-full bg-amber-600 text-white py-3 px-4 rounded-lg hover:bg-amber-700 transition-colors font-semibold shadow-md">Create Account</button>
            </div>
        </form>

        <p class="text-sm text-center text-gray-500 mt-6">
            Already have an account? <a href="login.html" class="font-medium text-amber-600 hover:underline">Login</a>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const categorySelect = document.getElementById('category');
            const shopNameContainer = document.getElementById('shopNameContainer');
            const shopNameInput = document.getElementById('shopName');

            categorySelect.addEventListener('change', function() {
                if (this.value === 'supplier') {
                    shopNameContainer.classList.remove('hidden');
                    shopNameInput.required = true;
                } else {
                    shopNameContainer.classList.add('hidden');
                    shopNameInput.required = false;
                }
            });

            document.getElementById('signupForm').addEventListener('submit', function(event) {
                event.preventDefault();
                
                const users = JSON.parse(localStorage.getItem('vendorLinkUsers')) || [];

                const newUser = {
                    name: document.getElementById('name').value,
                    category: document.getElementById('category').value,
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                    shopName: document.getElementById('shopName').value || null
                };

                users.push(newUser);
                localStorage.setItem('vendorLinkUsers', JSON.stringify(users));

                alert('Account created successfully! Please log in.');
                window.location.href = 'login.html'; 
            });
        });
    </script>
</body>
</html>
