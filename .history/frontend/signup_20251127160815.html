<!DOCTYPE html>
<html lang="en" class="bg-gray-100 dark:bg-gray-900">
<head>
  <meta charset="UTF-8">
  <title>VendorLink • Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="min-h-screen flex items-center justify-center">

  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 w-full max-w-md">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Create Account</h2>
      <button id="themeToggle" class="text-sm text-gray-500 dark:text-gray-300">🌓</button>
    </div>

    <form id="signupForm" class="space-y-4">
      <input id="name" type="text" placeholder="Full Name"
             class="w-full p-3 rounded-lg border dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100" required>
      <input id="email" type="email" placeholder="Email"
             class="w-full p-3 rounded-lg border dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100" required>
      <input id="password" type="password" placeholder="Password"
             class="w-full p-3 rounded-lg border dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100" required>

      <select id="role"
              class="w-full p-3 rounded-lg border dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100" required>
        <option value="vendor">Vendor (Street Food Seller)</option>
        <option value="supplier">Supplier (Raw Material Provider)</option>
      </select>

      <button type="submit"
              class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-lg font-semibold">
        Create Account
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-4">
      Already have an account?
      <a href="login.html" class="text-amber-600 dark:text-amber-400 font-semibold">Login</a>
    </p>
  </div>

  <script type="module" src="assets/js/signup.js"></script>
</body>
</html>
