<!DOCTYPE html>
<html lang="en" class="bg-gray-100 dark:bg-gray-900">
<head>
  <meta charset="UTF-8">
  <title>Login • VendorLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" }</script>
</head>
<body class="text-gray-900 dark:text-gray-100">

  <!-- NAVBAR (same as above) -->
  <!-- ... copy navbar block here ... -->

  <main class="min-h-[calc(100vh-64px)] flex items-center justify-center px-4">
    <div class="bg-white dark:bg-gray-800 shadow-xl rounded-2xl p-10 w-full max-w-md">
      <h1 class="text-3xl font-bold text-center mb-6">Welcome Back 👋</h1>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="text-sm text-gray-600 dark:text-gray-300">Email</label>
          <input id="email" type="email"
                 class="w-full mt-1 p-3 rounded-lg border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-amber-500"
                 required>
        </div>
        <div>
          <label class="text-sm text-gray-600 dark:text-gray-300">Password</label>
          <input id="password" type="password"
                 class="w-full mt-1 p-3 rounded-lg border dark:border-gray-700 bg-gray-50 dark:bg-gray-900 dark:text-gray-100 focus:ring-2 focus:ring-amber-500"
                 required>
        </div>
        <button
          class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-lg text-lg font-semibold shadow-md">
          Login
        </button>
      </form>

      <p class="text-center mt-4 text-sm text-gray-600 dark:text-gray-300">
        New here?
        <a href="signup.html" class="text-amber-600 dark:text-amber-400 font-semibold underline">Create an account</a>
      </p>
    </div>
  </main>

  <script type="module" src="assets/js/login.js"></script>
  <script type="module" src="assets/js/navbar.js"></script>
</body>
</html>
