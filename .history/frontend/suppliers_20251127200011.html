<!DOCTYPE html>
<html lang="en" class="bg-gray-100 dark:bg-gray-900">
<head>
  <meta charset="UTF-8">
  <title>Suppliers • VendorLink</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
</head>

<body class="text-gray-900 dark:text-gray-100">
<nav class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md shadow-sm border-b border-gray-200 dark:border-gray-700">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">

    <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
      <span class="text-2xl font-extrabold text-amber-600 tracking-tight">VendorLink</span>
    </div>

    <div class="flex items-center gap-6 text-sm font-medium">
      <a href="index.html" class="nav-link">Home</a>
      <a href="marketplace.html" class="nav-link">Marketplace</a>
      <a href="suppliers.html" class="nav-link">Suppliers</a>
      <a href="community.html" class="nav-link">Community Hub</a>
      <a href="cart.html" class="nav-link">Cart</a>

      <a id="nav-supplier-dashboard" href="supplier_dashboard.html" class="nav-link hidden">
        Dashboard
      </a>
    </div>

    <div class="flex items-center gap-4">

      <div id="roleSliderWrapper" class="hidden">
        <label class="flex items-center gap-2 text-sm font-medium text-gray-600 dark:text-gray-300">
          <span id="roleText"></span>
          <input id="roleToggle" type="checkbox" disabled class="toggle-checkbox">
        </label>
      </div>

      <button id="themeToggle" class="theme-btn">🌓</button>

      <div id="nav-auth-guest" class="flex items-center gap-3">
        <a href="login.html" class="btn-outline">Login</a>
        <a href="signup.html" class="btn-filled">Sign Up</a>
      </div>

      <div id="nav-auth-user" class="hidden relative">
        <button id="profileBtn" class="profile-btn">Profile ⬇</button>

        <div id="profileDropdown"
             class="hidden absolute right-0 mt-2 w-40 bg-white dark:bg-gray-800 shadow-md rounded-lg overflow-hidden">
          <a href="profile.html" class="dropdown-item">My Profile</a>

          <button id="logoutBtn"
                  class="dropdown-item text-red-500 hover:bg-red-50 dark:hover:bg-gray-700">
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>    

<script type="module" src="assets/js/navbar.js"></script>

<section class="max-w-7xl mx-auto px-6 py-10">
  <h1 class="text-4xl font-bold text-amber-600 mb-6">Top Suppliers</h1>

  <p class="text-gray-600 dark:text-gray-300 mb-6 text-lg">
    Browse trusted suppliers offering vegetables, grains, spices, packaging materials and more.
  </p>

  <div id="supplierList" class="grid md:grid-cols-3 gap-6"></div>
</section>

<script>
  // Sample static supplier list (can connect backend later)
  const suppliers = [
    {
      name: "Mumbai Fresh Veggies",
      category: "Vegetables & Fruits",
      location: "Dadar Market",
      img: "https://images.unsplash.com/photo-1587049352846-4c4e1c90e1e0"
    },
    {
      name: "Premium Spices Hub",
      category: "Spices & Masalas",
      location: "Crawford Market",
      img: "https://images.unsplash.com/photo-1590086782792-42dd2350140d"
    },
    {
      name: "Quality Packaging Co.",
      category: "Packaging Items",
      location: "Saki Naka",
      img: "https://images.unsplash.com/photo-1556912173-3bb406ef7e77"
    }
  ];

  const container = document.getElementById("supplierList");

  suppliers.forEach(s => {
    container.innerHTML += `
      <div class="bg-white dark:bg-gray-800 rounded-xl shadow hover:shadow-lg transition p-4">
        <img src="${s.img}" class="rounded-lg h-40 w-full object-cover mb-4"/>
        <h2 class="text-xl font-semibold">${s.name}</h2>
        <p class="text-gray-600 dark:text-gray-300">${s.category}</p>
        <p class="text-sm text-gray-500 mt-1">📍 ${s.location}</p>
        <button class="w-full bg-amber-600 text-white px-4 py-2 mt-4 rounded-lg hover:bg-amber-700">
          Contact Supplier
        </button>
      </div>
    `;
  });
</script>

</body>
</html>
