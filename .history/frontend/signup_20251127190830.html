<!DOCTYPE html>
<html lang="en" class="bg-gray-100 dark:bg-gray-900">
<head>
  <meta charset="UTF-8">
  <title>Sign Up • VendorLink</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" }</script>

  <!-- styles same as index.html -->
  <style>
    .nav-link { color:#444; text-decoration:none; }
    .nav-link:hover { color:#d97706; }
    .dark .nav-link { color:#ddd; }
    .btn-outline { padding:6px 14px; border:1px solid #d97706; color:#d97706; border-radius:8px; }
    .btn-filled { background:#d97706; color:white; padding:6px 14px; border-radius:8px; }
    .profile-btn { padding:6px 14px; background:#f3f4f6; border-radius:8px; }
    .dropdown-item { padding:10px 15px; display:block; }
    .toggle-checkbox { width:40px; height:20px; accent-color:#d97706; }
    .theme-btn { padding:6px; background:#e5e7eb; border-radius:6px; }
  </style>
</head>

<body class="text-gray-900 dark:text-gray-100">

<!-- NAVBAR (same as index.html) -->
<nav class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md shadow-sm border-b">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <div onclick="window.location='index.html'" class="cursor-pointer text-2xl font-extrabold text-amber-600">VendorLink</div>

    <div class="flex gap-6">
      <a href="index.html" class="nav-link">Home</a>
      <a href="marketplace.html" class="nav-link">Marketplace</a>
      <a href="suppliers.html" class="nav-link">Suppliers</a>
      <a href="community.html" class="nav-link">Community Hub</a>
      <a href="cart.html" class="nav-link">Cart</a>
      <a id="nav-supplier-dashboard" href="supplier_dashboard.html" class="nav-link hidden">Dashboard</a>
    </div>

    <div class="flex gap-4 items-center">
      <div id="roleSliderWrapper" class="hidden">
        <span id="roleText"></span>
        <input id="roleToggle" type="checkbox" disabled class="toggle-checkbox">
      </div>

      <button id="themeToggle" class="theme-btn">🌓</button>

      <div id="nav-auth-guest" class="flex gap-3">
        <a href="login.html" class="btn-outline">Login</a>
        <a href="signup.html" class="btn-filled">Sign Up</a>
      </div>

      <div id="nav-auth-user" class="hidden relative">
        <button id="profileBtn" class="profile-btn">Profile ⬇</button>
        <div id="profileDropdown" class="hidden absolute right-0 mt-2 w-40 bg-white dark:bg-gray-800 shadow-lg rounded-lg">
          <a href="profile.html" class="dropdown-item">My Profile</a>
          <button id="logoutBtn" class="dropdown-item text-red-500">Logout</button>
        </div>
      </div>
    </div>
  </div>
</nav>

<main class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="bg-white dark:bg-gray-800 shadow-xl rounded-2xl p-10 w-full max-w-md">

    <h1 class="text-3xl font-bold text-center mb-6">Create an Account</h1>

    <form id="signupForm" class="space-y-5">
      <div>
        <label>Name</label>
        <input id="name" required class="w-full p-3 border rounded-lg dark:bg-gray-900">
      </div>

      <div>
        <label>Email</label>
        <input id="email" required class="w-full p-3 border rounded-lg dark:bg-gray-900">
      </div>

      <div>
        <label>Password</label>
        <input id="password" type="password" required class="w-full p-3 border rounded-lg dark:bg-gray-900">
      </div>

      <div>
        <label>Role</label>
        <select id="role" class="w-full p-3 border rounded-lg dark:bg-gray-900">
          <option value="vendor">Vendor</option>
          <option value="supplier">Supplier</option>
        </select>
      </div>

      <button class="w-full bg-amber-600 py-3 rounded-lg text-white font-semibold">Create Account</button>
    </form>

    <p class="text-center mt-4">Already have an account?
      <a href="login.html" class="text-amber-600">Login</a>
    </p>
  </div>
</main>

<script type="module" src="assets/js/navbar.js"></script>
<script type="module" src="assets/js/signup.js"></script>

</body>
</html>
