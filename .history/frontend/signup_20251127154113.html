<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VendorLink - Sign Up</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6">Create Account</h2>

        <form id="signupForm" class="space-y-4">

            <div>
                <label class="block text-sm font-medium">Full Name</label>
                <input id="name" type="text" class="w-full p-3 border rounded-lg" required />
            </div>

            <div>
                <label class="block text-sm font-medium">Email</label>
                <input id="email" type="email" class="w-full p-3 border rounded-lg" required />
            </div>

            <div>
                <label class="block text-sm font-medium">Password</label>
                <input id="password" type="password" class="w-full p-3 border rounded-lg" required />
            </div>

            <button
                type="submit"
                class="w-full bg-amber-600 text-white p-3 rounded-lg font-semibold">
                Create Account
            </button>

        </form>

        <p class="text-center mt-4 text-sm">
            Already have an account?
            <a href="login.html" class="text-amber-600 font-semibold">Login</a>
        </p>
    </div>

    <script src="js/signup.js"></script>
</body>
</html>
