<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VendorLink • Supplier Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

<h1 class="text-3xl font-bold p-6 text-center">Add New Product</h1>

<form id="addProductForm" class="max-w-lg mx-auto space-y-4 bg-white p-6 rounded-xl shadow">
    <input id="pName" type="text" placeholder="Product Name" class="w-full p-3 border rounded" required>
    <input id="pPrice" type="number" placeholder="Price" class="w-full p-3 border rounded" required>
    <input id="pImage" type="text" placeholder="Image URL" class="w-full p-3 border rounded" required>
    <input id="pCategory" type="text" placeholder="Category" class="w-full p-3 border rounded" required>

    <button class="bg-amber-600 w-full py-3 text-white rounded hover:bg-amber-700">
        Add Product
    </button>
</form>

<script type="module" src="assets/js/supplier.js"></script>
</body>
</html>
