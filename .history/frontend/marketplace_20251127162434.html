<!DOCTYPE html>
<html lang="en" class="bg-gray-100 dark:bg-gray-900">
<head>
  <meta charset="UTF-8">
  <title>VendorLink • Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="min-h-screen">

<nav class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md shadow-sm border-b border-gray-200 dark:border-gray-700">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 onclick="window.location.href='index.html'" 
        class="text-2xl font-extrabold text-amber-600 cursor-pointer tracking-tight">
      VendorLink
    </h1>

    <div class="flex gap-4 items-center">
      <button id="themeToggle" class="w-10 h-10 rounded-full flex items-center justify-center bg-gray-200 dark:bg-gray-700">
        🌓
      </button>

      <button onclick="logout()"
              class="px-4 py-2 text-sm font-semibold text-red-600 dark:text-red-400 hover:underline">
        Logout
      </button>
    </div>
  </div>
</nav>


<main class="p-6">
  <h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-100 mb-4">Available Products</h2>
  <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
</main>

<script type="module" src="assets/js/marketplace.js"></script>
</body>
</html>
