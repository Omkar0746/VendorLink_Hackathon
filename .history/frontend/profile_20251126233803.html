<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile - VendorLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#FDFBF6] flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-[#4A4A4A]">Your Vendor Profile</h1>
            <p class="text-gray-500 mt-2">Manage your account details.</p>
        </div>

        <div id="profileDetails" class="space-y-4 text-left">
            <div>
                <label class="block text-sm font-medium text-gray-500">Name</label>
                <p id="profileName" class="mt-1 text-lg font-semibold text-gray-800 p-3 bg-gray-50 rounded-lg"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-500">Username</label>
                <p id="profileUsername" class="mt-1 text-lg font-semibold text-gray-800 p-3 bg-gray-50 rounded-lg"></p>
            </div>
             <div>
                <label class="block text-sm font-medium text-gray-500">Category</label>
                <p id="profileCategory" class="mt-1 text-lg font-semibold text-gray-800 p-3 bg-gray-50 rounded-lg"></p>
            </div>
        </div>

        <div class="mt-8">
            <button id="logoutBtn" class="w-full bg-red-600 text-white py-3 px-4 rounded-lg hover:bg-red-700 transition-colors font-semibold shadow-md">Logout</button>
        </div>
         <div class="mt-4 text-center">
            <a href="./index.html" class="text-sm text-amber-600 hover:underline">← Back to Dashboard</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));

            if (currentUser && currentUser.category === 'vendor') {
                document.getElementById('profileName').textContent = currentUser.name;
                document.getElementById('profileUsername').textContent = currentUser.username;
                document.getElementById('profileCategory').textContent = currentUser.category.charAt(0).toUpperCase() + currentUser.category.slice(1);
            } else {
                alert('You must be logged in as a vendor to view this page.');
                // FIX: Changed to a valid relative URL to prevent errors when run locally.
                window.location.href = './login.html';
            }

            document.getElementById('logoutBtn').addEventListener('click', function() {
                localStorage.removeItem('currentUser');
                alert('You have been logged out.');
                 // FIX: Changed to a valid relative URL.
                window.location.href = './index.html';
            });
        });
    </script>

    <script type="module" src="assets/js/profile.js"></script>

</body>
</html>
