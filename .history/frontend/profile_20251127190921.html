<!DOCTYPE html>
<html lang="en" class="bg-gray-100 dark:bg-gray-900">
<head>
  <meta charset="UTF-8">
  <title>My Profile • VendorLink</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:"class"}</script>

  <style>
    .nav-link{color:#444;} .nav-link:hover{color:#d97706;}
  </style>
</head>

<body class="text-gray-900 dark:text-gray-100">

<!-- NAVBAR -->
<nav class="sticky top-0 z-50 bg-white dark:bg-gray-900 border-b">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">

    <div onclick="location.href='index.html'" class="text-2xl text-amber-600 font-bold cursor-pointer">VendorLink</div>

<script type="module" src="assets/js/navbar.js"></script>
