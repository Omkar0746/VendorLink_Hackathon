<!DOCTYPE html>
<html lang="en" class="bg-gray-100 dark:bg-gray-900">
<head>
  <meta charset="UTF-8">
  <title>Marketplace • VendorLink</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
</head>

<body class="text-gray-900 dark:text-gray-100">

<!-- Navbar -->
<nav class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md shadow-sm border-b border-gray-200 dark:border-gray-700">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">

    <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
      <span class="text-2xl font-extrabold text-amber-600 tracking-tight">VendorLink</span>
    </div>

    <div class="flex items-center gap-6 text-sm font-medium">
      <a href="index.html" class="nav-link">Home</a>
      <a href="marketplace.html" class="nav-link">Marketplace</a>
      <a href="suppliers.html" class="nav-link">Suppliers</a>
      <a href="community.html" class="nav-link">Community Hub</a>
      <a href="cart.html" class="nav-link">Cart</a>

      <a id="nav-supplier-dashboard" href="supplier_dashboard.html" class="nav-link hidden">
        Dashboard
      </a>
    </div>

    <div class="flex items-center gap-4">

      <div id="roleSliderWrapper" class="hidden">
        <label class="flex items-center gap-2 text-sm font-medium text-gray-600 dark:text-gray-300">
          <span id="roleText"></span>
          <input id="roleToggle" type="checkbox" disabled class="toggle-checkbox">
        </label>
      </div>

      <button id="themeToggle" class="theme-btn">🌓</button>

      <div id="nav-auth-guest" class="flex items-center gap-3">
        <a href="login.html" class="btn-outline">Login</a>
        <a href="signup.html" class="btn-filled">Sign Up</a>
      </div>

      <div id="nav-auth-user" class="hidden relative">
        <button id="profileBtn" class="profile-btn">Profile ⬇</button>

        <div id="profileDropdown"
             class="hidden absolute right-0 mt-2 w-40 bg-white dark:bg-gray-800 shadow-md rounded-lg overflow-hidden">
          <a href="profile.html" class="dropdown-item">My Profile</a>

          <button id="logoutBtn"
                  class="dropdown-item text-red-500 hover:bg-red-50 dark:hover:bg-gray-700">
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
  
  <!-- Search Bar -->
  <div class="mb-6">
    <input id="searchBar" placeholder="Search raw materials..." class="w-full p-3 rounded-xl border dark:bg-gray-800" />
  </div>

  <!-- Product Grid -->
  <div id="productList" class="grid md:grid-cols-3 gap-6"></div>

</section>

<script type="module">
  const products = [
    {
      name: "Fresh Tomatoes",
      category: "Vegetables",
      price: 38,
      image: "https://images.unsplash.com/photo-1601333141735-b1c4f1cd5a02",
      supplierName: "Mumbai Fresh Veggies"
    },
    {
      name: "Red Onions",
      category: "Vegetables",
      price: 26,
      image: "https://images.unsplash.com/photo-1615485290382-49bb0a650a07",
      supplierName: "Farm to Home Suppliers"
    },
    {
      name: "Potatoes (Premium)",
      category: "Vegetables",
      price: 22,
      image: "https://images.unsplash.com/photo-1569058242253-92a9c755a3aa",
      supplierName: "Veggie Basket Co."
    },
    {
      name: "Wheat Flour (Atta)",
      category: "Grains",
      price: 45,
      image: "https://images.unsplash.com/photo-1615485290590-3af01f7cdb14",
      supplierName: "Pure Grains Hub"
    },
    {
      name: "Rice – Premium Basmati",
      category: "Grains",
      price: 89,
      image: "https://images.unsplash.com/photo-1615485364632-92e2bca2cfa0",
      supplierName: "Indian Rice Traders"
    },
    {
      name: "Cooking Oil – Sunflower",
      category: "Oil & Ghee",
      price: 152,
      image: "https://images.unsplash.com/photo-1589883661928-71a9da3a3db5",
      supplierName: "Healthy Oils Pvt Ltd"
    },
    {
      name: "Coriander Powder",
      category: "Spices",
      price: 58,
      image: "https://images.unsplash.com/photo-1623330188314-66e4ae79e927",
      supplierName: "Premium Spices Hub"
    },
    {
      name: "Turmeric Powder",
      category: "Spices",
      price: 62,
      image: "https://images.unsplash.com/photo-1623330170402-7a6c2e2da975",
      supplierName: "Premium Spices Hub"
    },
    {
      name: "Fresh Green Chillies",
      category: "Vegetables",
      price: 40,
      image: "https://images.unsplash.com/photo-1592407926045-43d9440c63a7",
      supplierName: "Mumbai Fresh Veggies"
    },
    {
      name: "Disposable Plates (50 pcs)",
      category: "Packaging",
      price: 75,
      image: "https://images.unsplash.com/photo-1563898785381-5cc0f4076142",
      supplierName: "Quality Packaging Co."
    }
  ];

  const container = document.getElementById("productList");

  function renderProducts() {
    container.innerHTML = "";

    products.forEach(p => {
      container.innerHTML += `
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow hover:shadow-lg transition p-4">
          <img src="${p.image}" class="rounded-lg h-40 w-full object-cover mb-4" />

          <h2 class="text-xl font-semibold">${p.name}</h2>
          <p class="text-gray-500 dark:text-gray-300">${p.category}</p>
          <p class="mt-2 text-lg font-bold text-amber-600">₹${p.price}/kg</p>

          <p class="text-sm text-gray-500 mt-1">Supplier: ${p.supplierName}</p>

          <button
            onclick="addToCart('${p.name}', ${p.price})"
            class="bg-amber-600 text-white w-full py-2 mt-4 rounded-lg hover:bg-amber-700">
            Add to Cart
          </button>
        </div>
      `;
    });
  }

  window.addToCart = (name, price) => {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.push({ name, price, qty: 1 });
    localStorage.setItem("cart", JSON.stringify(cart));
    alert("Added to cart!");
  };

  renderProducts();
</script>


</body>
</html>
