<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VendorLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>

<body class="bg-[#FDFBF6] flex items-center justify-center min-h-screen py-12">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#4A4A4A]">Welcome Back</h1>
            <p class="text-gray-500 mt-2">Login to your VendorLink account</p>
        </div>

        <form id="loginForm" class="space-y-4">

            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" class="w-full p-3 border rounded-lg" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" class="w-full p-3 border rounded-lg" required>
            </div>

            <button
                type="submit"
                class="w-full bg-amber-600 text-white py-3 rounded-lg font-semibold hover:bg-amber-700">
                Login
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            Don't have an account?
            <a href="signup.html" class="text-amber-600 font-medium hover:underline">Sign Up</a>
        </p>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
